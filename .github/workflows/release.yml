name: Release

# Triggers when the version in package.json is bumped on a push to main.
# See RELEASING.md for the full process.
#
# One-time npm setup (OIDC Trusted Publishing — no long-lived secrets):
#   1. npmjs.com → package settings → Publish access → Trusted Publishers
#   2. Add: GitHub Actions, owner=OpenBox-AI,
#      repo=openbox-openrouter-sdk-ts, workflow=release.yml
#   3. Leave NPM_TOKEN unset — GitHub OIDC is used automatically.
#
# Fallback: add NPM_TOKEN to repo secrets (Settings → Secrets → Actions).

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_LINUX_X64_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 — Governance
# Confirms the required files exist, that CODEOWNERS covers the sensitive
# release-path files, and that this version is not already on npm. Every later
# stage is skipped when the version is unchanged, so an unrelated package.json
# edit does not trigger a release.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  release-governance:
    name: Release Governance
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      package: ${{ steps.get_version.outputs.package }}
      should_publish: ${{ steps.check_npm.outputs.should_publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required files exist
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            ".github/CODEOWNERS"
            ".gitleaks.toml"
            "CODE_OF_CONDUCT.md"
            "LICENSE"
            "README.md"
            "SECURITY.md"
            "package.json"
            "package-lock.json"
            "sonar-project.properties"
            "tsconfig.json"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "${f}" ]; then
              echo "Missing required file: ${f}"
              exit 1
            fi
          done
          echo "All required governance files present."

      - name: Verify CODEOWNERS coverage for protected files
        shell: bash
        run: |
          set -euo pipefail
          declare -a required_patterns=(
            "/.github/workflows/"
            "/.github/CODEOWNERS"
            "/.gitleaks.toml"
            "/CODE_OF_CONDUCT.md"
            "/LICENSE"
            "/SECURITY.md"
            "/package.json"
            "/package-lock.json"
            "/sonar-project.properties"
          )
          for pattern in "${required_patterns[@]}"; do
            if ! awk '!/^#/ && NF >= 2 {print $1}' .github/CODEOWNERS | grep -Fxq "${pattern}"; then
              echo "Missing CODEOWNERS entry: ${pattern}"
              exit 1
            fi
          done

      - name: Get package name and version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          package=$(node -p "require('./package.json').name")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "${package}@${version}"

      - name: Check if version already exists on npm
        id: check_npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.version }}"
          PKG="${{ steps.get_version.outputs.package }}"
          if npm view "${PKG}@${VERSION}" version 2>/dev/null | grep -q "${VERSION}"; then
            echo "Version ${VERSION} already exists on npm — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} is new — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2 — Quality (parallel with security)
# ─────────────────────────────────────────────────────────────────────────────
  release-quality:
    name: Release Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: [release-governance]
    if: needs.release-governance.outputs.should_publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        node: ["20", "22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI validation
        run: npm run ci:check

      # Emit coverage only from the primary matrix leg so SonarQube sees one
      # lcov file rather than two overlapping ones.
      - name: Upload coverage report
        if: matrix.node == env.NODE_VERSION
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Verify pack contents
        run: npm run pack:check

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3a — Security: Trivy
# ─────────────────────────────────────────────────────────────────────────────
  release-security-trivy:
    name: Release Security (Trivy)
    runs-on: ubuntu-latest
    needs: [release-governance]
    if: needs.release-governance.outputs.should_publish == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          cache: true
          version: v0.69.2

      - name: Run Trivy filesystem scan (console)
        id: trivy_console
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,misconfig \
            --vuln-type os,library \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --include-dev-deps \
            --format table \
            --exit-code 1

      - name: Run Trivy filesystem scan (SARIF)
        id: trivy_sarif
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,misconfig \
            --vuln-type os,library \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --include-dev-deps \
            --format sarif \
            --output trivy-release-results.sarif \
            --exit-code 1

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-release-results.sarif
          category: trivy-release

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-release-results
          path: trivy-release-results.sarif
          if-no-files-found: error

      - name: Fail job when Trivy detects issues
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.trivy_console.outcome }}" == "failure" || "${{ steps.trivy_sarif.outcome }}" == "failure" ]]; then
            echo "Trivy detected HIGH/CRITICAL findings. Release blocked."
            exit 1
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3b — Security: Gitleaks
# ─────────────────────────────────────────────────────────────────────────────
  release-security-secrets:
    name: Release Security (Gitleaks)
    runs-on: ubuntu-latest
    needs: [release-governance]
    if: needs.release-governance.outputs.should_publish == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        id: gitleaks_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-release-results.sarif

      - name: Ensure Gitleaks SARIF file exists
        if: always()
        shell: bash
        run: |
          if [ -f gitleaks-release-results.sarif ]; then
            exit 0
          fi
          cat > gitleaks-release-results.sarif <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "gitleaks",
                    "informationUri": "https://github.com/gitleaks/gitleaks",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF

      - name: Upload Gitleaks SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-release-results.sarif
          category: gitleaks-release

      - name: Upload Gitleaks SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-release-results
          path: gitleaks-release-results.sarif
          if-no-files-found: error

      - name: Fail job when Gitleaks detects issues
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.gitleaks_scan.outcome }}" == "failure" ]]; then
            echo "Gitleaks detected potential secrets. Release blocked."
            exit 1
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Stage 4 — SonarQube (aggregates coverage + security SARIFs)
# Runs only when SONAR_TOKEN and SONAR_HOST_URL are set; otherwise no-ops so
# forks without the shared SonarQube instance still ship.
# ─────────────────────────────────────────────────────────────────────────────
  release-sonarqube:
    name: Release SonarQube
    runs-on: ubuntu-latest
    needs:
      - release-governance
      - release-quality
      - release-security-trivy
      - release-security-secrets
    if: needs.release-governance.outputs.should_publish == 'true'

    steps:
      - name: Skip when SonarQube secrets are not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "Skipping SonarQube because SONAR_TOKEN or SONAR_HOST_URL is not configured."

      - name: Checkout repository
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/download-artifact@v4
        with:
          name: release-coverage-lcov
          path: coverage

      - name: Download Trivy SARIF artifact
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/download-artifact@v4
        with:
          name: trivy-release-results
          path: security-artifacts/trivy

      - name: Download Gitleaks SARIF artifact
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-release-results
          path: security-artifacts/gitleaks

      - name: Compose SonarQube SARIF report paths
        id: sonar_sarif_paths
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          paths="security-artifacts/trivy/trivy-release-results.sarif"
          if [ -f "security-artifacts/gitleaks/gitleaks-release-results.sarif" ]; then
            paths="${paths},security-artifacts/gitleaks/gitleaks-release-results.sarif"
          else
            echo "Gitleaks SARIF not present; excluding from SonarQube scan."
          fi
          echo "paths=${paths}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.sarifReportPaths=${{ steps.sonar_sarif_paths.outputs.paths }}

      - name: SonarQube Quality Gate check
        id: sonarqube_quality_gate
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Fail job when SonarQube quality gate fails
        if: ${{ always() && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && steps.sonarqube_quality_gate.outcome == 'failure' }}
        shell: bash
        run: |
          echo "SonarQube Quality Gate failed."
          exit 1

# ─────────────────────────────────────────────────────────────────────────────
# Stage 5 — Publish (only after every prior stage passes)
# ─────────────────────────────────────────────────────────────────────────────
  release-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    needs:
      - release-governance
      - release-quality
      - release-security-trivy
      - release-security-secrets
      - release-sonarqube
    if: needs.release-governance.outputs.should_publish == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-governance.outputs.version }}
          name: "v${{ needs.release-governance.outputs.version }}"
          body: |
            ## ${{ needs.release-governance.outputs.package }} v${{ needs.release-governance.outputs.version }}

            OpenBox governance and observability for the OpenRouter Agent SDK.

            ```bash
            npm install ${{ needs.release-governance.outputs.package }}@${{ needs.release-governance.outputs.version }}
            ```

            📦 [npm package](https://www.npmjs.com/package/${{ needs.release-governance.outputs.package }})
          generate_release_notes: true

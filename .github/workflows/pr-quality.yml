name: PR Quality

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  # Matrix stays on 20 + 22 — the SDK ships to consumers that still pin Node 20
  # LTS. Coverage is emitted from the primary matrix leg only, so SonarQube and
  # Codecov never see two overlapping lcov files.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    outputs:
      coverage_available: ${{ steps.coverage_status.outputs.available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Run tests
        id: test
        continue-on-error: true
        run: npm test

      - name: Check coverage report
        if: ${{ always() && matrix.node == env.NODE_VERSION }}
        id: coverage_status
        shell: bash
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage report
        if: ${{ always() && matrix.node == env.NODE_VERSION }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: ${{ always() && matrix.node == env.NODE_VERSION && env.CODECOV_TOKEN != '' && steps.coverage_status.outputs.available == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          name: pr-quality
          fail_ci_if_error: true
          verbose: true
          token: ${{ env.CODECOV_TOKEN }}

      - name: Fail job when validation fails
        if: ${{ always() }}
        shell: bash
        run: |
          failed=0

          if [[ "${{ steps.lint.outcome }}" == "failure" ]]; then
            echo "Lint failed."
            failed=1
          fi

          if [[ "${{ steps.typecheck.outcome }}" == "failure" ]]; then
            echo "Typecheck failed."
            failed=1
          fi

          if [[ "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "Tests failed."
            failed=1
          fi

          exit "${failed}"

  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ always() && needs.test.result != 'cancelled' }}
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Verify pack contents
        shell: bash
        run: |
          set -euo pipefail
          pack_output=$(npm pack --dry-run 2>&1)
          echo "$pack_output"
          # dist/ is what consumers actually import — publishing without it
          # produces a package that installs cleanly and then fails on require.
          if ! echo "$pack_output" | grep -q "dist/"; then
            echo "ERROR: dist/ not found in pack output — run 'npm run build' first"
            exit 1
          fi
          if echo "$pack_output" | grep -qE "\.env|\.pem"; then
            echo "ERROR: pack contains a credential-shaped file"
            exit 1
          fi
          echo "Pack contents look correct."

  demo:
    name: Demo agent type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build the SDK the demo links to
        run: |
          npm ci
          npm run build

      - name: Install and type-check the demo
        working-directory: demo-agent
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    if: ${{ always() && needs.test.result != 'cancelled' }}
    needs:
      - test

    steps:
      - name: Skip when SonarQube secrets are not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "Skipping SonarQube because SONAR_TOKEN or SONAR_HOST_URL is not configured."

      - name: Checkout repository
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && needs.test.outputs.coverage_available == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - name: Skip coverage download when report is unavailable
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && needs.test.outputs.coverage_available != 'true' }}
        run: echo "Skipping coverage download because coverage/lcov.info was not produced."

      - name: Set up Java
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: sonarqube_quality_gate
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Print SonarQube result
        if: ${{ always() && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        shell: bash
        run: |
          set -uo pipefail
          status="${{ steps.sonarqube_quality_gate.outputs.quality-gate-status }}"
          [[ -z "${status}" ]] && status="UNKNOWN"

          # The gate's own verdict, condition by condition. Reading the
          # thresholds off a hardcoded list told us a gate failed but never
          # which condition did, which left the dashboard as the only way to
          # find out — and the dashboard needs credentials CI does not hand out.
          report="$(find . -name report-task.txt -path '*scannerwork*' | head -n 1)"
          if [[ -n "${report}" ]]; then
            ce_task_url="$(grep '^ceTaskUrl=' "${report}" | cut -d= -f2-)"
            analysis_id=""
            for _ in $(seq 1 30); do
              ce="$(curl -sS -H "Authorization: Bearer ${SONAR_TOKEN}" "${ce_task_url}" || true)"
              ce_status="$(jq -r '.task.status // empty' <<< "${ce}")"
              [[ "${ce_status}" == "SUCCESS" ]] && analysis_id="$(jq -r '.task.analysisId // empty' <<< "${ce}")" && break
              [[ "${ce_status}" == "FAILED" || "${ce_status}" == "CANCELED" ]] && break
              sleep 5
            done

            if [[ -n "${analysis_id}" ]]; then
              gate="$(curl -sS -H "Authorization: Bearer ${SONAR_TOKEN}" \
                "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${analysis_id}" || true)"
              echo "[QUALITY GATE] conditions:"
              jq -r '.projectStatus.conditions[]
                | "  \(if .status == "OK" then "PASS" else "FAIL" end)  \(.metricKey): actual=\(.actualValue) \(.comparator) threshold=\(.errorThreshold)"' \
                <<< "${gate}" || echo "  (could not parse gate response)"
              echo
              echo "[QUALITY GATE] failing conditions:"
              jq -r '.projectStatus.conditions[] | select(.status != "OK")
                | "  \(.metricKey) = \(.actualValue) (threshold \(.errorThreshold))"' \
                <<< "${gate}" || true

              # A count of new violations is not actionable; the issues are.
              # Ask under whatever the scanner actually analysed: this scan runs
              # without sonar.pullrequest.*, so the issues sit on the project's
              # branch, and a pullRequest= query returns an empty list beside a
              # non-zero count.
              scope=""
              task_branch="$(jq -r '.task.branch // empty' <<< "${ce}")"
              task_pr="$(jq -r '.task.pullRequest // empty' <<< "${ce}")"
              [[ -n "${task_branch}" ]] && scope="&branch=${task_branch}"
              [[ -n "${task_pr}" ]] && scope="&pullRequest=${task_pr}"
              issues="$(curl -sS -H "Authorization: Bearer ${SONAR_TOKEN}" \
                "${SONAR_HOST_URL}/api/issues/search?componentKeys=openbox-openrouter-sdk-ts&resolved=false&inNewCodePeriod=true${scope}&ps=100" || true)"
              echo
              echo "[QUALITY GATE] new issues:"
              if jq -e '.issues | length > 0' <<< "${issues}" > /dev/null 2>&1; then
                jq -r '.issues[] | "  \(.severity) \(.rule)\n    \(.component | sub("^[^:]*:"; "")):\(.line // 0)  \(.message)"' \
                  <<< "${issues}"
              else
                # Silence here previously read as "no issues" next to a count of
                # nine, so say which it is.
                echo "  none returned by the issues API — response follows:"
                head -c 2000 <<< "${issues}"
                echo
              fi
            else
              echo "Could not resolve the analysis id; see the SonarQube dashboard."
            fi
          else
            echo "No scanner report-task.txt found; see the SonarQube dashboard."
          fi

          echo "Quality Gate = ${status}"
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Fail job when SonarQube quality gate fails
        if: ${{ always() && env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && steps.sonarqube_quality_gate.outcome == 'failure' }}
        shell: bash
        run: |
          echo "SonarQube Quality Gate failed."
          exit 1

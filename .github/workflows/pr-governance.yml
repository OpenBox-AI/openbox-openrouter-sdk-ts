name: PR Governance

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Validate PR governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch naming
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|hotfix|chore|docs|refactor|test|ci|build|release)\/[a-z0-9._-]+$'
          if [[ ! "${BRANCH_NAME}" =~ ${pattern} ]]; then
            echo "Invalid branch name: ${BRANCH_NAME}"
            echo "Expected pattern: <type>/<short-description>"
            exit 1
          fi

      - name: Validate PR title convention
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|chore|docs|refactor|test|build|ci|perf|revert)(\([a-z0-9._/-]+\))?!?: .+$'
          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "Invalid PR title: ${PR_TITLE}"
            echo "Expected conventional commits format: <type>(<scope>): <description>"
            exit 1
          fi

      # Opt-in per-commit check. Squash-merge repos leave this off; repos that
      # keep a linear history flip ENFORCE_COMMIT_CONVENTION to 'true' at the
      # repo variable level.
      - name: Validate commit messages when enabled
        if: github.event_name == 'pull_request' && vars.ENFORCE_COMMIT_CONVENTION == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=1
          invalid=0
          while IFS= read -r subject; do
            if [[ -z "${subject}" ]]; then
              continue
            fi
            if [[ "${subject}" =~ ^Merge\  ]]; then
              continue
            fi
            if [[ ! "${subject}" =~ ^(feat|fix|chore|docs|refactor|test|build|ci|perf|revert)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
              echo "Invalid commit subject: ${subject}"
              invalid=1
            fi
          done < <(git log --format=%s "origin/${BASE_REF}..HEAD")
          exit "${invalid}"

      - name: Verify required files exist
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "package.json"
            "package-lock.json"
            "tsconfig.json"
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CODE_OF_CONDUCT.md"
            ".github/CODEOWNERS"
            ".gitleaks.toml"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "${file}" ]; then
              echo "Missing required file: ${file}"
              exit 1
            fi
          done
          echo "All required governance files present."

      # Governance-file edits without matching CODEOWNERS coverage silently
      # widen who can rewrite the release path. Fail the PR when either the
      # policy file is missing or the CODEOWNERS entry that guards it is.
      - name: Validate sensitive path ownership policy
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=1
          mapfile -t changed_files < <(git diff --name-only "origin/${BASE_REF}...HEAD")

          if [ ! -f .github/CODEOWNERS ]; then
            echo ".github/CODEOWNERS is required"
            exit 1
          fi

          needs_check=0
          for file in "${changed_files[@]}"; do
            case "${file}" in
              .github/workflows/*|.github/CODEOWNERS|SECURITY.md|.gitleaks.toml)
                needs_check=1
                ;;
            esac
          done

          if [ "${needs_check}" -eq 0 ]; then
            exit 0
          fi

          declare -A required_entries=(
            ["/.github/workflows/"]="workflow owners"
            ["/.github/CODEOWNERS"]="codeowners owners"
            ["/SECURITY.md"]="security owners"
            ["/.gitleaks.toml"]="secret scanning owners"
          )

          missing=()
          for pattern in "${!required_entries[@]}"; do
            if ! awk '!/^#/ && NF >= 2 {print $1}' .github/CODEOWNERS | grep -Fxq "${pattern}"; then
              missing+=("${required_entries[$pattern]} (${pattern})")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing CODEOWNERS coverage for:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

          echo "Sensitive file ownership policy is defined in CODEOWNERS."

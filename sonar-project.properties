# SonarQube configuration for openbox-openrouter-governance
sonar.projectKey=openbox-openrouter-sdk-ts
sonar.projectName=openbox-openrouter-sdk-ts
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.sourceEncoding=UTF-8

# TypeScript and coverage configuration
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=coverage/**,dist/**,docs/**,demo-agent/**,example/**,node_modules/**,test/**
sonar.coverage.exclusions=demo-agent/**,example/**,test/**,eslint.config.mjs,vitest.config.ts
